<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #B7B2BF; text-decoration:none; }
    a:hover { color: #F3F1ED; }
    ::-webkit-scrollbar { display: none; }
    input::placeholder { color: #6E6A78; }
  </style>
</helmet>

<div style="width:1440px; height:960px; background:#0E0D10; font-family:'Manrope',sans-serif; color:#F3F1ED; display:flex; overflow:hidden;">

  <div style="width:560px; flex:0 0 auto; height:100%; position:relative; overflow:hidden;">
    <div style="position:absolute; inset:0; background:
      radial-gradient(60% 60% at 80% 15%, rgba(150,170,200,0.16), transparent 60%),
      radial-gradient(70% 80% at 15% 90%, rgba({{accentRgb}},0.24), transparent 60%),
      linear-gradient(180deg, #1B1720 0%, #100E12 55%, #0A090B 100%);
    "></div>
    <div style="position:relative; height:100%; display:flex; flex-direction:column; justify-content:space-between; padding:48px;">
      <span style="font-family:'Bodoni Moda',serif; font-size:24px; font-weight:700; color:{{accentHex}};">ZATLAN</span>
      <div>
        <div style="font-family:'Bodoni Moda',serif; font-size:32px; font-weight:600; color:#FFFFFF; line-height:1.3;">This is how people find you.</div>
        <p style="font-size:14px; line-height:1.6; color:#C9C5D1; margin-top:14px; max-width:400px;">Your name and username show up on reviews, watch parties and your public profile.</p>
      </div>
    </div>
  </div>

  <div style="flex:1; min-width:0; height:100%; display:flex; flex-direction:column;">
    <div style="flex:0 0 auto; padding:32px 48px 0; display:flex; align-items:center; justify-content:space-between;">
      <div style="width:38px; height:38px; border-radius:50%; background:#17161A; border:1px solid #201E24; display:flex; align-items:center; justify-content:center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F3F1ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </div>
      <span style="font-size:12px; font-weight:700; color:#8B8794; letter-spacing:0.02em;">Step 3 of 6</span>
    </div>

    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
      <div style="width:100%; max-width:400px;">
        <div style="display:flex; gap:5px; margin-bottom:34px;">
          <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
          <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
          <div style="flex:1; height:4px; border-radius:3px; background:{{accentHex}};"></div>
          <div style="flex:1; height:4px; border-radius:3px; background:#232028;"></div>
          <div style="flex:1; height:4px; border-radius:3px; background:#232028;"></div>
          <div style="flex:1; height:4px; border-radius:3px; background:#232028;"></div>
        </div>

        <div style="font-family:'Bodoni Moda',serif; font-size:28px; font-weight:600; color:#FFFFFF;">Create your profile</div>
        <p style="font-size:14px; color:#8B8794; margin:8px 0 30px;">This is how people on ZATLAN will find and recognize you.</p>

        <label style="font-size:12px; font-weight:600; color:#B7B2BF; margin-bottom:8px; display:block;">Full name</label>
        <div style="padding:14px 16px; border-radius:12px; background:#17161A; border:1px solid #2A2730; margin-bottom:22px;">
          <input type="text" placeholder="Your name" value="Arjun Kumar" style="width:100%; border:none; outline:none; background:transparent; font-family:'Manrope',sans-serif; font-size:14px; color:#F3F1ED;">
        </div>

        <label style="font-size:12px; font-weight:600; color:#B7B2BF; margin-bottom:8px; display:block;">Username</label>
        <div style="display:flex; align-items:center; gap:8px; padding:14px 16px; border-radius:12px; background:#17161A; border:1px solid rgba(61,220,132,0.5);">
          <span style="font-size:14px; color:#6E6A78;">@</span>
          <input type="text" placeholder="username" value="arjun.movies" style="flex:1; border:none; outline:none; background:transparent; font-family:'Manrope',sans-serif; font-size:14px; color:#F3F1ED;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3DDC84" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
        </div>
        <div style="font-size:11.5px; color:#3DDC84; margin-top:7px;">This username is available</div>

        <div style="display:flex; align-items:center; justify-content:center; padding:15px; border-radius:12px; background:{{accentHex}}; margin-top:26px; cursor:pointer;">
          <span style="font-size:14px; font-weight:700; color:#0E0D10;">Continue</span>
        </div>
        <div style="text-align:center; margin-top:16px;">
          <a href="#" style="font-size:13px; font-weight:600; color:#8B8794;">Back</a>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"enum","default":"emerald","options":["emerald","cyan","purple","pink","amber","red"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const themes = {
      emerald: { hex: '#00C896', rgb: '0,200,150' },
      cyan:    { hex: '#00E5FF', rgb: '0,229,255' },
      purple:  { hex: '#A855F7', rgb: '168,85,247' },
      pink:    { hex: '#FF7AC2', rgb: '255,122,194' },
      amber:   { hex: '#FFB020', rgb: '255,176,32' },
      red:     { hex: '#FF385C', rgb: '255,56,92' }
    };
    const t = themes[this.props.accent] || themes.emerald;
    return { accentHex: t.hex, accentRgb: t.rgb };
  }
}
</script>
</body>
</html>
