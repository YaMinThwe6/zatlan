<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    ::-webkit-scrollbar { display: none; }
  </style>
</helmet>

<div style="width:1440px; height:960px; background:#0E0D10; font-family:'Manrope',sans-serif; color:#F3F1ED; position:relative; overflow:hidden;">

  <div style="position:absolute; inset:0; background:
    radial-gradient(45% 55% at 50% 42%, rgba({{accentRgb}},0.16), transparent 65%),
    linear-gradient(180deg, #100E12 0%, #0A090B 100%);
  "></div>

  <div style="position:absolute; top:40px; left:56px;">
    <span style="font-family:'Bodoni Moda',serif; font-size:24px; font-weight:700; color:{{accentHex}};">ZATLAN</span>
  </div>

  <div style="position:relative; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
    <div style="width:104px; height:104px; border-radius:50%; border:2.5px solid {{accentHex}}; box-shadow:0 0 36px rgba({{accentRgb}},0.4); display:flex; align-items:center; justify-content:center; margin-bottom:30px;">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="{{accentHex}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
    </div>
    <div style="font-family:'Bodoni Moda',serif; font-size:34px; font-weight:600; color:#FFFFFF;">Welcome to ZATLAN, Arjun!</div>
    <p style="font-size:15px; color:#8B8794; margin:12px 0 36px;">Your account is ready.</p>

    <div style="display:flex; align-items:center; justify-content:center; gap:9px; padding:15px 40px; border-radius:13px; background:{{accentHex}}; box-shadow:0 0 28px rgba({{accentRgb}},0.4);">
      <span style="font-size:14.5px; font-weight:700; color:#0E0D10;">Explore ZATLAN</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0E0D10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"enum","default":"emerald","options":["emerald","cyan","purple","pink","amber","red"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const themes = {
      emerald: { hex: '#00C896', rgb: '0,200,150' },
      cyan:    { hex: '#00E5FF', rgb: '0,229,255' },
      purple:  { hex: '#A855F7', rgb: '168,85,247' },
      pink:    { hex: '#FF7AC2', rgb: '255,122,194' },
      amber:   { hex: '#FFB020', rgb: '255,176,32' },
      red:     { hex: '#FF385C', rgb: '255,56,92' }
    };
    const t = themes[this.props.accent] || themes.emerald;
    return { accentHex: t.hex, accentRgb: t.rgb };
  }
}
</script>
</body>
</html>
