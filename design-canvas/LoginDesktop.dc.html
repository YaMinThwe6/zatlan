<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #B7B2BF; text-decoration:none; }
    a:hover { color: #F3F1ED; }
    ::-webkit-scrollbar { display: none; }
    input::placeholder { color: #6E6A78; }
  </style>
</helmet>

<div style="width:1440px; height:960px; background:#0E0D10; font-family:'Manrope',sans-serif; color:#F3F1ED; display:flex; overflow:hidden;">

  <!-- LEFT: branding panel -->
  <div style="width:560px; flex:0 0 auto; height:100%; position:relative; overflow:hidden;">
    <div style="position:absolute; inset:0; background:
      radial-gradient(60% 60% at 80% 15%, rgba(150,170,200,0.16), transparent 60%),
      radial-gradient(70% 80% at 15% 90%, rgba({{accentRgb}},0.24), transparent 60%),
      linear-gradient(180deg, #1B1720 0%, #100E12 55%, #0A090B 100%);
    "></div>
    <div style="position:relative; height:100%; display:flex; flex-direction:column; justify-content:space-between; padding:48px;">
      <span style="font-family:'Bodoni Moda',serif; font-size:24px; font-weight:700; color:{{accentHex}};">ZATLAN</span>
      <div>
        <div style="font-family:'Bodoni Moda',serif; font-size:32px; font-weight:600; color:#FFFFFF; line-height:1.3;">Your watchlist missed you.</div>
        <p style="font-size:14px; line-height:1.6; color:#C9C5D1; margin-top:14px; max-width:400px;">Pick up where you left off &mdash; new recommendations, watch parties and reviews from people you follow.</p>
      </div>
    </div>
  </div>

  <!-- RIGHT: form -->
  <div style="flex:1; min-width:0; height:100%; display:flex; flex-direction:column;">
    <div style="flex:0 0 auto; padding:32px 48px 0; display:flex; justify-content:flex-end;">
      <div style="width:38px; height:38px; border-radius:50%; background:#17161A; border:1px solid #201E24; display:flex; align-items:center; justify-content:center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F3F1ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </div>
    </div>

    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
      <div style="width:100%; max-width:400px;">
        <div style="font-family:'Bodoni Moda',serif; font-size:28px; font-weight:600; color:#FFFFFF;">Welcome back</div>
        <p style="font-size:14px; color:#8B8794; margin:8px 0 32px;">Log in to keep the watchlist going.</p>

        <div style="display:flex; flex-direction:column; gap:12px;">
          <div style="display:flex; align-items:center; justify-content:center; gap:10px; padding:14px; border-radius:12px; background:#FFFFFF; cursor:pointer;">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-4z"></path><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"></path><path fill="#4CAF50" d="M24 45c5.2 0 9.9-1.7 13.6-4.7l-6.3-5.3C29.3 36.9 26.8 38 24 38c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 41.5 16.3 45 24 45z"></path><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3C39.9 36.8 44 32 44 24c0-1.4-.1-2.7-.4-3.5z"></path></svg>
            <span style="font-size:14px; font-weight:700; color:#1A1A1A;">Continue with Google</span>
          </div>
          <div style="display:flex; align-items:center; justify-content:center; gap:10px; padding:14px; border-radius:12px; background:#17161A; border:1px solid #2A2730; cursor:pointer;">
            <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#F35325"></rect><rect x="11" y="1" width="9" height="9" fill="#81BC06"></rect><rect x="1" y="11" width="9" height="9" fill="#05A6F0"></rect><rect x="11" y="11" width="9" height="9" fill="#FFBA08"></rect></svg>
            <span style="font-size:14px; font-weight:700; color:#F3F1ED;">Continue with Microsoft</span>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:12px; margin:26px 0;">
          <div style="flex:1; height:1px; background:#201E24;"></div>
          <span style="font-size:11.5px; color:#6E6A78;">or</span>
          <div style="flex:1; height:1px; background:#201E24;"></div>
        </div>

        <label style="font-size:12px; font-weight:600; color:#B7B2BF; margin-bottom:8px; display:block;">Email address</label>
        <div style="display:flex; align-items:center; gap:9px; padding:14px 16px; border-radius:12px; background:#17161A; border:1px solid #2A2730; margin-top:6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
          <input type="email" placeholder="you@example.com" style="flex:1; border:none; outline:none; background:transparent; font-family:'Manrope',sans-serif; font-size:14px; color:#F3F1ED;">
        </div>

        <div style="display:flex; align-items:center; justify-content:center; padding:15px; border-radius:12px; background:{{accentHex}}; margin-top:16px; cursor:pointer;">
          <span style="font-size:14px; font-weight:700; color:#0E0D10;">Send me a code</span>
        </div>

        <div style="text-align:center; margin-top:26px; font-size:13.5px; color:#8B8794;">
          Don&rsquo;t have an account? <a href="#" style="font-weight:700; color:{{accentHex}};">Sign up</a>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"enum","default":"emerald","options":["emerald","cyan","purple","pink","amber","red"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const themes = {
      emerald: { hex: '#00C896', rgb: '0,200,150' },
      cyan:    { hex: '#00E5FF', rgb: '0,229,255' },
      purple:  { hex: '#A855F7', rgb: '168,85,247' },
      pink:    { hex: '#FF7AC2', rgb: '255,122,194' },
      amber:   { hex: '#FFB020', rgb: '255,176,32' },
      red:     { hex: '#FF385C', rgb: '255,56,92' }
    };
    const t = themes[this.props.accent] || themes.emerald;
    return { accentHex: t.hex, accentRgb: t.rgb };
  }
}
</script>
</body>
</html>
